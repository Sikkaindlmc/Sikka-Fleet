services:
  - type: web
    name: sikka-fleet-backend
    runtime: node
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        sync: false
      - key: NODE_ENV
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHEELSEYE_API_URL
        sync: false
      - key: WHEELSEYE_API_TOKEN
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: GEOCODER_PROVIDER
        sync: false
      - key: GEOCODER_API_KEY
        sync: false
      - key: GEOCODER_USER_AGENT
        sync: false
      - key: NOMINATIM_REVERSE_URL
        sync: false
      - key: LOCATIONIQ_REVERSE_URL
        sync: false
      - key: GEOAPIFY_REVERSE_URL
        sync: false
