name: GPS automatic synchronization

'on':
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: gps-auto-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require scheduler secret
        env:
          GPS_SYNC_SCHEDULER_SECRET: ${{ secrets.GPS_SYNC_SCHEDULER_SECRET }}
        run: |
          if [ -z "$GPS_SYNC_SCHEDULER_SECRET" ]; then
            echo "GPS_SYNC_SCHEDULER_SECRET is not configured."
            exit 1
          fi

      - name: Trigger production GPS synchronization
        env:
          GPS_SYNC_SCHEDULER_SECRET: ${{ secrets.GPS_SYNC_SCHEDULER_SECRET }}
        run: |
          response="$(curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --connect-timeout 10 --max-time 310 \
            --request POST \
            --header "Authorization: Bearer $GPS_SYNC_SCHEDULER_SECRET" \
            --header "Content-Type: application/json" \
            --data '{}' \
            https://fleet.sikkaind.com/api/internal/gps-sync)"
          echo "$response"
          if echo "$response" | jq -e '.executed == true and .success == false' >/dev/null; then
            echo "The automatic GPS synchronization failed; see the production sync log."
            exit 1
          fi
